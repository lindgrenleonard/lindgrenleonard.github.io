<!doctype html>
<html>
  <head>
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/stylesheet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }
      footer {
        position: static;
        margin-top: auto;
      }
      .container {
        text-align: center;
        margin: 60px auto 40px;
        max-width: 800px;
        padding: 0 20px;
      }
      .container h1 {
        font-size: 2.5rem;
        margin-bottom: 0.3em;
      }
      .subtitle {
        font-size: 1.1rem;
        opacity: 0.7;
        margin-bottom: 2rem;
      }
      #comic-container {
        min-height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #comic-title {
        font-family: "Roboto Slab", serif;
        font-size: 1.3rem;
        margin-bottom: 0.5em;
      }
      #comic-img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
      }
      #comic-alt {
        margin-top: 0.8em;
        font-style: italic;
        opacity: 0.65;
        max-width: 600px;
        font-size: 0.9rem;
      }
      #another-btn {
        margin-top: 1.5rem;
        padding: 10px 24px;
        font-family: "Montserrat", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        border: 2px solid currentColor;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      #another-btn:hover:not(:disabled) {
        opacity: 0.7;
      }
      #another-btn:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      .spinner {
        border: 3px solid light-dark(#ddd, #444);
        border-top: 3px solid light-dark(#333, #f0f0f0);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
        margin: 40px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error-msg {
        color: #cc4444;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/projects.html">Projects</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </header>
    <div class="container">
      <h1>Oops, something went wrong</h1>
      <p class="subtitle">
        The page you're looking for doesn't exist. Maybe this will cheer you up
        though:
      </p>
      <div id="comic-container">
        <div class="spinner"></div>
      </div>
      <button id="another-btn" onclick="loadRandomComic()" disabled>
        Show me another
      </button>
    </div>
    <script>
      const MAX_COMIC = 3050;
      const API_URL = "https://xkcd.now.sh/?comic=";

      async function loadRandomComic() {
        const container = document.getElementById("comic-container");
        const btn = document.getElementById("another-btn");

        btn.disabled = true;
        container.innerHTML = '<div class="spinner"></div>';

        try {
          const num = Math.floor(Math.random() * MAX_COMIC) + 1;
          const res = await fetch(API_URL + num);
          if (!res.ok) throw new Error("Failed to fetch");
          const comic = await res.json();

          container.innerHTML = `
            <p id="comic-title">${comic.title} (#${comic.num})</p>
            <img id="comic-img" src="${comic.img}" alt="${(comic.alt || "").replace(/"/g, "&quot;")}">
            <p id="comic-alt">${comic.alt || ""}</p>
          `;
        } catch (e) {
          container.innerHTML =
            '<p id="error-msg">Failed to load comic. Try again?</p>';
        } finally {
          btn.disabled = false;
        }
      }

      loadRandomComic();
    </script>
    <footer>
      <div>
        <a
          href="https://github.com/lindgrenleonard"
          target="_blank"
          class="social-link"
        >
          <i class="fa-brands fa-github"></i
        ></a>
        <a
          href="https://www.linkedin.com/in/leonard-lindgren/"
          target="_blank"
          class="social-link"
        >
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="mailto:contact@lindgren.dev" class="social-link">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </div>
      <small>
        <p>&copy; 2025 Leonard Lindgren</p>
      </small>
    </footer>
  </body>
</html>
